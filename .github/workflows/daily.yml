name: clawde daily

on:
  schedule:
    # Plain interval. UTC, but interval crons don't care about timezones or DST.
    # Every 12h (2 posts/day) — recommended starting cadence.
    - cron: "0 */12 * * *"
    # Every 5h (4.8 posts/day) — swap to this once you have 15+ scenes.
    # - cron: "0 */5 * * *"
  workflow_dispatch:        # manual run button

jobs:
  make-and-post:
    runs-on: ubuntu-latest
    concurrency:
      # Two runs must never render at once — they'd pick the same scene and
      # both push to the log, and one push would lose.
      group: clawde-daily
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install deps
        run: npm ci || npm install puppeteer

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Write a fixed test concept
        run: |
          SLUG="$(date -u +%Y-%m-%d-%H%M)"
          cat > config.json <<EOF
          {
            "date": "$(date -u +%F)",
            "slug": "$SLUG",
            "scene": "scenes/bounce.html",
            "hook": "pipeline test, ignore",
            "caption": "pipeline test",
            "palette": { "bg": "#0f0e17", "fg": "#ff8906", "accent": "#e53170" },
            "duration": 6,
            "privacyLevel": "SELF_ONLY"
          }
          EOF
          cat config.json

      - name: Render
        run: node scripts/render.mjs --config config.json --out out/

      - name: Upload to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          SLUG=$(node -p "require('./config.json').slug")
          URL=$(node scripts/upload.mjs --file "out/$SLUG.mp4")
          echo "VIDEO_URL=$URL" >> "$GITHUB_ENV"
          echo "uploaded: $URL"

      - name: Post to TikTok
        env:
          POSTPEER_API_KEY: ${{ secrets.POSTPEER_API_KEY }}
          TIKTOK_ACCOUNT_ID: ${{ secrets.TIKTOK_ACCOUNT_ID }}
        run: node scripts/post.mjs --url "$VIDEO_URL" --config config.json

      - name: Keep the mp4 even if posting fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clawde-${{ github.run_number }}
          path: out/*.mp4

      - name: Commit the posting log
        run: |
          git pull --rebase || true
          git config user.name "clawde-bot"
          git config user.email "bot@users.noreply.github.com"
          git add references/channel.md config.json
          git commit -m "clawde: $(date -u +%F)" || echo "nothing to commit"
          git push
