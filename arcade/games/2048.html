<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2048 — Neon Arcade</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔢</text></svg>">
<link rel="stylesheet" href="../assets/game.css">
<style>
  .board{position:relative;width:420px;max-width:86vw;aspect-ratio:1;background:rgba(255,255,255,.05);border-radius:16px;padding:12px}
  .cellbg,.tile{position:absolute;border-radius:11px}
  .cellbg{background:rgba(255,255,255,.04)}
  .tile{display:grid;place-items:center;font-weight:800;color:#241a08;
        transition:transform .12s cubic-bezier(.2,.8,.2,1),left .12s,top .12s;
        box-shadow:0 6px 16px -6px rgba(0,0,0,.7)}
  .tile.new{animation:pop .18s cubic-bezier(.2,1.6,.5,1)}
  .tile.merged{animation:bump .18s ease}
  @keyframes pop{from{transform:scale(.2);opacity:0}}
  @keyframes bump{50%{transform:scale(1.14)}}
</style>
</head>
<body>
<div class="bar"><div class="bar-in">
  <a class="back" href="../index.html">←&nbsp;Arcade</a>
  <div class="gname">2048<small>Puzzle · Chill</small></div>
  <div class="hud">
    <div class="pill"><i>Score</i><b id="score">0</b></div>
    <div class="pill"><i>Best</i><b id="best">0</b></div>
    <div class="pill"><i>Moves</i><b id="moves">0</b></div>
  </div>
</div></div>

<div class="stage">
  <div class="panel">
    <div class="board" id="board"></div>
    <div class="over" id="over"></div>
  </div>
  <div class="btns">
    <button class="btn primary" id="go">New game</button>
    <button class="btn" id="undo">Undo</button>
  </div>
  <p class="hint"><kbd>arrows</kbd> or <kbd>WASD</kbd> to slide · swipe on touch · merge matching tiles until one says <b>2048</b>.</p>
</div>

<script src="../assets/arcade.js"></script>
<script>
(function () {
  'use strict';
  var N = 4, board = document.getElementById('board');
  var over = ARC.overlay(document.getElementById('over'));
  var $ = function (i) { return document.getElementById(i); };
  var COLORS = {
    2:'#f0e6d6', 4:'#ece0c8', 8:'#ffb339', 16:'#ff8f4d', 32:'#ff6b5e', 64:'#ff3ea5',
    128:'#c77dff', 256:'#9b6bff', 512:'#6a5cff', 1024:'#22e5c8', 2048:'#ffe14d'
  };
  var grid, score, moves, won, prev = null, tiles = {}, uid = 1;
  $('best').textContent = ARC.store.best('g2048');

  function px() { return board.clientWidth - 24; }
  function layout() {
    var size = (px() - 10 * (N - 1)) / N;
    board.querySelectorAll('.cellbg').forEach(function (c, i) {
      var r = Math.floor(i / N), q = i % N;
      c.style.width = c.style.height = size + 'px';
      c.style.left = (12 + q * (size + 10)) + 'px';
      c.style.top = (12 + r * (size + 10)) + 'px';
    });
    Object.keys(tiles).forEach(function (k) { place(tiles[k], size); });
  }
  function place(t, size) {
    size = size || (px() - 10 * (N - 1)) / N;
    t.el.style.width = t.el.style.height = size + 'px';
    t.el.style.left = (12 + t.c * (size + 10)) + 'px';
    t.el.style.top = (12 + t.r * (size + 10)) + 'px';
    t.el.style.fontSize = (t.v > 999 ? size * 0.3 : size * 0.4) + 'px';
  }

  function build() {
    board.innerHTML = '';
    for (var i = 0; i < N * N; i++) { var d = document.createElement('div'); d.className = 'cellbg'; board.appendChild(d); }
  }

  function addTile(r, c, v, isNew) {
    var el = document.createElement('div');
    el.className = 'tile' + (isNew ? ' new' : '');
    el.textContent = v;
    el.style.background = COLORS[v] || '#ffe14d';
    el.style.color = v > 4 ? '#0b0713' : '#3a2f16';
    board.appendChild(el);
    var t = { id: uid++, r: r, c: c, v: v, el: el };
    tiles[t.id] = t; place(t); return t;
  }
  function clearTiles() { Object.keys(tiles).forEach(function (k) { tiles[k].el.remove(); }); tiles = {}; }

  function emptyCells() {
    var out = [];
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) if (!grid[r][c]) out.push([r, c]);
    return out;
  }
  function spawn() {
    var e = emptyCells(); if (!e.length) return;
    var p = e[(Math.random() * e.length) | 0], v = Math.random() < 0.9 ? 2 : 4;
    grid[p[0]][p[1]] = addTile(p[0], p[1], v, true);
  }

  function reset() {
    grid = []; for (var r = 0; r < N; r++) grid.push(new Array(N).fill(null));
    clearTiles(); score = 0; moves = 0; won = false; prev = null;
    spawn(); spawn(); sync(); over.hide(); layout();
  }
  function sync() { $('score').textContent = score; $('moves').textContent = moves; }

  function snapshot() {
    return {
      score: score, moves: moves,
      cells: grid.map(function (row) { return row.map(function (t) { return t ? t.v : 0; }); })
    };
  }
  function restore(s) {
    clearTiles();
    grid = []; for (var r = 0; r < N; r++) grid.push(new Array(N).fill(null));
    for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) if (s.cells[y][x]) grid[y][x] = addTile(y, x, s.cells[y][x]);
    score = s.score; moves = s.moves; sync(); over.hide();
  }

  function move(dir) {
    var snap = snapshot(), moved = false;
    var dr = { u: -1, d: 1, l: 0, r: 0 }[dir], dc = { u: 0, d: 0, l: -1, r: 1 }[dir];
    var order = [];
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) order.push([r, c]);
    if (dr > 0) order.sort(function (a, b) { return b[0] - a[0]; });
    if (dc > 0) order.sort(function (a, b) { return b[1] - a[1]; });

    var mergedAt = {};
    order.forEach(function (p) {
      var r = p[0], c = p[1], t = grid[r][c];
      if (!t) return;
      var nr = r, nc = c;
      while (true) {
        var tr = nr + dr, tc = nc + dc;
        if (tr < 0 || tc < 0 || tr >= N || tc >= N) break;
        var dest = grid[tr][tc];
        if (!dest) { nr = tr; nc = tc; continue; }
        if (dest.v === t.v && !mergedAt[tr + ',' + tc]) {
          grid[r][c] = null;
          dest.v *= 2; dest.el.textContent = dest.v;
          dest.el.style.background = COLORS[dest.v] || '#ffe14d';
          dest.el.style.color = dest.v > 4 ? '#0b0713' : '#3a2f16';
          dest.el.classList.remove('merged'); void dest.el.offsetWidth; dest.el.classList.add('merged');
          t.r = tr; t.c = tc; place(t);
          var dead = t;
          setTimeout(function () { dead.el.remove(); }, 120);
          delete tiles[t.id];
          mergedAt[tr + ',' + tc] = 1;
          score += dest.v; moved = true;
          if (dest.v === 2048 && !won) { won = true; ARC.sfx.win(); setTimeout(function () { over.show('2048!', '<p>You actually did it. Keep going for a bigger number.</p><br><button class="btn primary" onclick="document.getElementById(\'over\').classList.remove(\'show\')">Keep playing</button>'); }, 200); }
          place(dest);
          return;
        }
        break;
      }
      if (nr !== r || nc !== c) {
        grid[r][c] = null; grid[nr][nc] = t; t.r = nr; t.c = nc; place(t); moved = true;
      }
    });

    if (moved) {
      prev = snap; moves++; sync(); ARC.sfx.pick(330 + (moves % 6) * 40);
      setTimeout(function () { spawn(); if (dead()) lose(); }, 120);
    }
  }

  function dead() {
    if (emptyCells().length) return false;
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
      var v = grid[r][c].v;
      if (c + 1 < N && grid[r][c + 1].v === v) return false;
      if (r + 1 < N && grid[r + 1][c].v === v) return false;
    }
    return true;
  }
  function lose() {
    ARC.sfx.bad();
    var rec = ARC.store.submit('g2048', score);
    $('best').textContent = ARC.store.best('g2048');
    over.show(rec ? 'New record!' : 'Board is full',
      '<div class="big">' + score + '</div><p>' + moves + ' moves' + (rec ? ' · new personal best' : '') + '</p>');
  }

  document.addEventListener('keydown', function (e) {
    var m = { ArrowUp:'u', ArrowDown:'d', ArrowLeft:'l', ArrowRight:'r', w:'u', s:'d', a:'l', d:'r', W:'u', S:'d', A:'l', D:'r' }[e.key];
    if (m) { e.preventDefault(); move(m); }
  });
  var sx, sy;
  board.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  board.addEventListener('touchend', function (e) {
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) + Math.abs(dy) < 26) return;
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'r' : 'l') : (dy > 0 ? 'd' : 'u'));
  }, { passive: true });

  $('go').addEventListener('click', reset);
  $('undo').addEventListener('click', function () { if (prev) { restore(prev); prev = null; } });
  window.addEventListener('resize', layout);

  build(); reset();
})();
</script>
</body>
</html>
