<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pong Duel — Neon Arcade</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏓</text></svg>">
<link rel="stylesheet" href="../assets/game.css">
</head>
<body>
<div class="bar"><div class="bar-in">
  <a class="back" href="../index.html">←&nbsp;Arcade</a>
  <div class="gname">Pong Duel<small>Versus · First to 7</small></div>
  <div class="hud">
    <div class="pill"><i>You</i><b id="s1">0</b></div>
    <div class="pill"><i id="oppLabel">CPU</i><b id="s2">0</b></div>
    <div class="pill"><i>Rally</i><b id="rally">0</b></div>
  </div>
</div></div>

<div class="stage">
  <div class="panel">
    <canvas id="cv"></canvas>
    <div class="over" id="over"></div>
  </div>
  <div class="btns">
    <button class="btn primary" id="go">New match</button>
    <button class="btn" id="mode">Mode: 1 player</button>
    <button class="btn" id="diff">CPU: normal</button>
  </div>
  <p class="hint">Left paddle: <kbd>W</kbd>/<kbd>S</kbd> or mouse · Right paddle: <kbd>↑</kbd>/<kbd>↓</kbd> in 2-player · first to 7 takes the match.</p>
</div>

<script src="../assets/arcade.js"></script>
<script>
(function () {
  'use strict';
  var W = 680, H = 420, PW = 12, PH = 78, TARGET = 7;
  var cv = document.getElementById('cv');
  var ctx = ARC.fit(cv, W, H); ARC.responsive(cv, W);
  var over = ARC.overlay(document.getElementById('over'));
  var $ = function (i) { return document.getElementById(i); };

  var p1, p2, ball, s1, s2, rally, keys = {}, running, twoP = false, trail, diff = 1, flashT = 0;
  var DIFFS = [['chill', .055, 5.2], ['normal', .085, 6.4], ['brutal', .135, 7.6]];

  function serve(dir) {
    var a = (Math.random() - .5) * 0.7;
    ball = { x: W / 2, y: H / 2, vx: Math.cos(a) * 5.4 * dir, vy: Math.sin(a) * 5.4, r: 8 };
    rally = 0; $('rally').textContent = 0; trail = [];
  }
  function reset() {
    p1 = { y: H / 2 - PH / 2 }; p2 = { y: H / 2 - PH / 2 };
    s1 = 0; s2 = 0; running = true; serve(Math.random() < .5 ? 1 : -1);
    $('s1').textContent = 0; $('s2').textContent = 0; over.hide();
  }

  function ai() {
    var d = DIFFS[diff], target = ball.y - PH / 2;
    if (ball.vx < 0) target = H / 2 - PH / 2;         /* drift home when the ball leaves */
    p2.y += (target - p2.y) * d[1] * (1 + Math.min(1, rally / 14));
  }

  function step() {
    if (!running) return;
    var sp = 7.2;
    if (keys.w) p1.y -= sp; if (keys.s) p1.y += sp;
    if (twoP) { if (keys.up) p2.y -= sp; if (keys.down) p2.y += sp; } else ai();
    p1.y = Math.max(6, Math.min(H - PH - 6, p1.y));
    p2.y = Math.max(6, Math.min(H - PH - 6, p2.y));

    ball.x += ball.vx; ball.y += ball.vy;
    trail.push({ x: ball.x, y: ball.y }); if (trail.length > 12) trail.shift();

    if (ball.y - ball.r < 4) { ball.y = 4 + ball.r; ball.vy *= -1; ARC.sfx.pick(420); }
    if (ball.y + ball.r > H - 4) { ball.y = H - 4 - ball.r; ball.vy *= -1; ARC.sfx.pick(420); }

    function bounce(px, py, dir) {
      var hit = (ball.y - (py + PH / 2)) / (PH / 2);
      var speed = Math.min(13.5, Math.hypot(ball.vx, ball.vy) * 1.06);
      var ang = hit * 0.9;
      ball.vx = Math.cos(ang) * speed * dir;
      ball.vy = Math.sin(ang) * speed;
      ball.x = dir > 0 ? px + PW + ball.r : px - ball.r;
      rally++; $('rally').textContent = rally; flashT = 6;
      ARC.sfx.pick(600 + rally * 16);
    }
    if (ball.vx < 0 && ball.x - ball.r <= 22 + PW && ball.x > 10 && ball.y > p1.y - 6 && ball.y < p1.y + PH + 6) bounce(22, p1.y, 1);
    if (ball.vx > 0 && ball.x + ball.r >= W - 22 - PW && ball.x < W - 10 && ball.y > p2.y - 6 && ball.y < p2.y + PH + 6) bounce(W - 22 - PW, p2.y, -1);

    if (ball.x < -20) { s2++; $('s2').textContent = s2; ARC.sfx.bad(); check(-1); }
    if (ball.x > W + 20) { s1++; $('s1').textContent = s1; ARC.sfx.good(); check(1); }
    if (flashT > 0) flashT--;
  }

  function check(dir) {
    if (s1 >= TARGET || s2 >= TARGET) {
      running = false;
      var youWon = s1 >= TARGET;
      if (youWon) ARC.sfx.win();
      over.show(youWon ? 'You win!' : (twoP ? 'Player 2 wins!' : 'CPU wins'),
        '<div class="big">' + s1 + ' – ' + s2 + '</div><p>' + (youWon ? 'Clean sweep energy.' : 'Run it back.') + '</p>');
    } else serve(dir);
  }

  function draw() {
    ctx.fillStyle = '#05050b'; ctx.fillRect(0, 0, W, H);
    ctx.setLineDash([9, 13]); ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(W / 2, 10); ctx.lineTo(W / 2, H - 10); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = 'rgba(255,255,255,' + (flashT ? .5 : .08) + ')'; ctx.lineWidth = 2;
    ctx.strokeRect(2, 2, W - 4, H - 4);

    ctx.font = '900 76px Segoe UI,sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,.07)';
    ctx.fillText(s1, W / 2 - 80, 96); ctx.fillText(s2, W / 2 + 80, 96);

    function paddle(x, y, c) {
      ctx.save(); ctx.shadowColor = c; ctx.shadowBlur = 22; ctx.fillStyle = c;
      ctx.beginPath();
      if (ctx.roundRect) { ctx.roundRect(x, y, PW, PH, 6); } else { ctx.rect(x, y, PW, PH); }
      ctx.fill(); ctx.restore();
    }
    paddle(22, p1.y, '#22e5c8');
    paddle(W - 22 - PW, p2.y, '#ff3ea5');

    trail.forEach(function (t, i) {
      ctx.globalAlpha = (i / trail.length) * .35;
      ctx.fillStyle = '#7c5cff';
      ctx.beginPath(); ctx.arc(t.x, t.y, ball.r * (i / trail.length), 0, 7); ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.save(); ctx.shadowColor = '#fff'; ctx.shadowBlur = 24; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, 7); ctx.fill(); ctx.restore();
  }

  function loop() { step(); draw(); requestAnimationFrame(loop); }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'w' || e.key === 'W') keys.w = 1;
    if (e.key === 's' || e.key === 'S') keys.s = 1;
    if (e.key === 'ArrowUp') { e.preventDefault(); keys.up = 1; }
    if (e.key === 'ArrowDown') { e.preventDefault(); keys.down = 1; }
    if (e.key === 'Enter' && !running) reset();
  });
  document.addEventListener('keyup', function (e) {
    if (e.key === 'w' || e.key === 'W') keys.w = 0;
    if (e.key === 's' || e.key === 'S') keys.s = 0;
    if (e.key === 'ArrowUp') keys.up = 0;
    if (e.key === 'ArrowDown') keys.down = 0;
  });
  function track(clientY) {
    var r = cv.getBoundingClientRect();
    p1.y = Math.max(6, Math.min(H - PH - 6, (clientY - r.top) * (H / r.height) - PH / 2));
  }
  cv.addEventListener('mousemove', function (e) { track(e.clientY); });
  cv.addEventListener('touchmove', function (e) {
    var r = cv.getBoundingClientRect();
    for (var i = 0; i < e.touches.length; i++) {
      var t = e.touches[i], x = (t.clientX - r.left) * (W / r.width);
      var y = Math.max(6, Math.min(H - PH - 6, (t.clientY - r.top) * (H / r.height) - PH / 2));
      if (x < W / 2) p1.y = y; else if (twoP) p2.y = y;
    }
  }, { passive: true });

  $('go').addEventListener('click', reset);
  $('mode').addEventListener('click', function () {
    twoP = !twoP;
    $('mode').textContent = 'Mode: ' + (twoP ? '2 players' : '1 player');
    $('oppLabel').textContent = twoP ? 'P2' : 'CPU';
    $('diff').style.opacity = twoP ? .4 : 1;
    reset();
  });
  $('diff').addEventListener('click', function () {
    diff = (diff + 1) % 3;
    $('diff').textContent = 'CPU: ' + DIFFS[diff][0];
  });

  reset(); loop();
})();
</script>
</body>
</html>
